<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description"
        content="Snazzy Paws Grooming Contact page. Where you go to find out where we are and how to contact us!"/>
  <title>Contact - Snazzy Paws Grooming</title>

  <!-- W3.CSS for responsive layout -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="w3-container w3-center w3-padding-16"
          style="background-color: var(--primary-color);">
    <div class="logo-container w3-center">
      <img src="images/snazzy_paws_grooming_logo.webp"
           alt="Snazzy Paws Grooming Logo"
           class="logo w3-circle" />
    </div>
    <h1 class="w3-xxlarge" style="color: #2c3e50; margin-left:15px;">
      Snazzy Paws Grooming
    </h1>
  </header>

  <!-- NAVIGATION BAR -->
  <nav>
    <ul class="w3-bar w3-center w3-light-grey w3-border-bottom" style="list-style: none; margin: 0; padding: 0;">
      <li class="w3-bar-item"><a href="index.html" class="w3-button w3-round-large" style="color: var(--secondary-color);">Home</a></li>
      <li class="w3-bar-item"><a href="services.html" class="w3-button w3-round-large" style="color: var(--secondary-color);">Services</a></li>
      <li class="w3-bar-item"><a href="gallery.html" class="w3-button w3-round-large" style="color: var(--secondary-color);">Gallery</a></li>
      <li class="w3-bar-item"><a href="booking.html" class="w3-button w3-round-large" style="color: var(--secondary-color);">Booking</a></li>
      <li class="w3-bar-item"><a href="contact.html" class="w3-button w3-round-large" style="color: var(--secondary-color);">Contact</a></li>
      <li class="w3-bar-item"><a href="privacy-policy.html" class="w3-button w3-round-large" style="color: var(--secondary-color);">Privacy Policy</a></li>
    </ul>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="w3-container w3-padding-32">

    <!-- Heading -->
    <div class="heading w3-center" style="background-color:#dff9fb; padding:20px;">
      <h2 style="color: var(--secondary-color);">Contact Us</h2>
    </div>

    <!-- Contact Map -->
    <div class="contact-map w3-center w3-margin-bottom">
      <h3>We are here!</h3>
      <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345093874!2d144.95373631561698!3d-37.81627974202185!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf577e865cd9d4192!2sSnazzy%20Paws%20Grooming!5e0!3m2!1sen!2sus!4v1234567890123!5m2!1sen!2sus"
        width="600"
        height="450"
        style="border:0;"
        allowfullscreen
        aria-label="Google Map showing location of Snazzy Paws Grooming"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <!-- Contact Form -->
    <form class="form-details w3-card w3-padding w3-margin-bottom">
      <h3>Contact Us!</h3>
      <label for="name">Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required
      />

      <label for="email">Email Address:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      />

      <label for="phone-number">Phone Number:</label>
      <input
        type="text"
        id="phone-number"
        name="phone-number"
        placeholder="Enter your phone number"
        required
      />

      <label for="comment">Comments:</label>
      <input
        type="text"
        id="comment"
        name="comment"
        placeholder="Enter your Comments"
        required
      />

      <button type="submit">Submit</button>
    </form>

    <!-- Contact Info -->
    <div class="contact-info w3-margin-bottom">
      <p><strong>Email:</strong>
        <a href="mailto:contact@snazzypaws.com">contact@snazzypaws.com</a>
      </p>
      <p><strong>Phone:</strong>
        <a href="tel:+645551234567">+64 (555) 123-4567</a>
      </p>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="w3-container w3-center"
          style="background-color: #34495e; color: #ecf0f1; padding:20px;">
    <div class="social-icons w3-xlarge w3-section">
      <img src="images/facebook-icon.webp" alt="Facebook"
           style="width:30px; height:30px; margin:10px;"/>
      <img src="images/twitter-icon.webp" alt="Twitter"
           style="width:30px; height:30px; margin:10px;"/>
      <img src="images/instagram-icon.webp" alt="Instagram"
           style="width:30px; height:30px; margin:10px;"/>
      <img src="images/whatsapp-icon.webp" alt="WhatsApp"
           style="width:30px; height:30px; margin:10px;"/>
      <img src="images/youtube-icon.webp" alt="YouTube"
           style="width:30px; height:30px; margin:10px;"/>
    </div>
    <p>Opening Hours: Mon-Sat 9:00 AM - 5:00 PM</p>
  </footer>

</body>
</html>
